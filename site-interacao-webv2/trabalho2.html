<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabalho 2 - Prova On-line</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Utilização do Web Component de cabeçalho com injeção de conteúdo via Slot[cite: 2, 14] -->
    <site-header>
      <span slot="subtitulo">Trabalho 2: Prova On-line de Web Components</span>
    </site-header>
    
    <!-- Utilização do Web Component de navegação[cite: 2] -->
    <site-nav></site-nav>

    <main>
      <div class="container">
        <section class="card">
          <!-- Utilização do Custom Element contendo a Prova encapsulada no Shadow DOM[cite: 2] -->
          <my-test></my-test>
        </section>
      </div>
    </main>

    <!-- Utilização do Web Component de rodapé[cite: 2] -->
    <site-footer></site-footer>

    <!-- Importação do arquivo de script que define os componentes criados[cite: 17] -->
    <script src="js/components.js"></script>
  </body>
</html>
